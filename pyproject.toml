[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-assisted-rag"
version = "0.1.0"
description = "Decision-assisted dossier RAG and reproducible evaluation"
requires-python = ">=3.11"
dependencies = [
    "azure-identity>=1.19,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "tiktoken>=0.12,<1",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["app*", "clients*", "ingestion*", "pipelines*", "evaluation*"]

[tool.setuptools.package-data]
app = ["static/*.html"]
evaluation = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
